name: Feature Request
description: Propose a new agent adapter, MCP bundle, platform backend, or runtime capability
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New Coding Agent Adapter
        - Sandbox / Kernel Confinement (Linux / macOS / WSL2)
        - External MCP Firewall / Bundle
        - Copy-on-Write VFS / Auto-Merge
        - CLI UX / Diagnostics (`audit-me`, `diff`, `commit`)
        - Documentation / Example
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What workflow is blocked or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the CLI, policy, or behavior you'd like to see.
    validations:
      required: true
  - type: checkboxes
    id: contrib
    attributes:
      label: Contribution Interest
      options:
        - label: I would be interested in submitting a PR for this with guidance.
