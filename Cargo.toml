[workspace]
resolver = "2"
members = [
    "crates/aos-core",
    "crates/aos-policy",
    "crates/aos-vfs",
    "crates/aos-ipc",
    "crates/aos-sandbox",
    "crates/aos-egress",
    "crates/aos-recorder",
    "crates/aos-memory",
    "crates/aos-memory-gateway",
    "crates/aos-memory-store",
    "crates/aos-memory-server",
    "crates/aos-mcp-gateway",
    "crates/aos-cli",
]

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "Apache-2.0"
authors = ["Aegis OS Team"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
rand = "0.8"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
libc = "0.2"
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.12"

aos-core = { path = "crates/aos-core" }
aos-policy = { path = "crates/aos-policy" }
aos-vfs = { path = "crates/aos-vfs" }
aos-ipc = { path = "crates/aos-ipc" }
aos-sandbox = { path = "crates/aos-sandbox" }
aos-egress = { path = "crates/aos-egress" }
aos-recorder = { path = "crates/aos-recorder" }
aos-memory = { path = "crates/aos-memory" }
aos-memory-gateway = { path = "crates/aos-memory-gateway" }
aos-memory-store = { path = "crates/aos-memory-store" }
aos-memory-server = { path = "crates/aos-memory-server" }
aos-mcp-gateway = { path = "crates/aos-mcp-gateway" }
